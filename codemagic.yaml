workflows:
  lamp-lifeform-ios:
    name: 共生体 iOS Build
    environment:
      flutter: 3.27.4
      xcode: 16.0
      cocoapods: default
      groups:
        - symbio
    scripts:
      - name: 获取依赖
        script: flutter pub get
      - name: 构建iOS签名版
        script: flutter build ipa --release --export-method app-store
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - erlang@proton.me

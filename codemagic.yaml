workflows:
  lamp-lifeform-ios:
    name: 共生体 iOS Build
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - symbio
    scripts:
      - name: 检查签名变量
        script: |
          echo "KEY_IDENTIFIER长度: ${#APP_STORE_CONNECT_KEY_IDENTIFIER}"
          echo "ISSUER_ID长度: ${#APP_STORE_CONNECT_ISSUER_ID}"
          echo "PRIVATE_KEY长度: ${#APP_STORE_CONNECT_PRIVATE_KEY}"
          echo "PRIVATE_KEY开头: ${APP_STORE_CONNECT_PRIVATE_KEY:0:20}"
      - name: 获取依赖
        script: flutter pub get
      - name: 设置构建版本
        script: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 21" ios/Runner/Info.plist
      - name: 初始化签名钥匙串
        script: |
          keychain initialize
      - name: 拉取签名证书
        script: |
          app-store-connect fetch-signing-files com.symbio.lbLifeformIos \
            --type IOS_APP_STORE --create
          echo "签名证书拉取完成"
      - name: 添加证书到钥匙串
        script: |
          keychain add-certificates
      - name: 配置Xcode签名
        script: |
          xcode-project use-profiles
      - name: 构建iOS签名版
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
          echo "=== IPA位置检查 ==="
          ls -la build/ios/ipa/ 2>/dev/null || find . -name "*.ipa" -maxdepth 5 2>/dev/null || echo "没找到ipa"
          mkdir -p build/ios/ipa
          find . -name "*.ipa" -maxdepth 5 -exec cp {} build/ios/ipa/ \;
          ls build/ios/ipa/
    artifacts:
      - build/ios/ipa/*.ipa
      - build/**/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
      email:
        recipients:
          - erlang@proton.me

workflows:
  lamp-lifeform-ios:
    name: 共生体 iOS Build
    environment:
      flutter: 3.27.4
      xcode: 16.0
      cocoapods: default
      groups:
        - symbio
    scripts:
      - name: 检查签名变量
        script: |
          echo "KEY_IDENTIFIER长度: ${#APP_STORE_CONNECT_KEY_IDENTIFIER}"
          echo "ISSUER_ID长度: ${#APP_STORE_CONNECT_ISSUER_ID}"
          echo "PRIVATE_KEY长度: ${#APP_STORE_CONNECT_PRIVATE_KEY}"
          echo "PRIVATE_KEY开头: ${APP_STORE_CONNECT_PRIVATE_KEY:0:20}"
      - name: 获取依赖
        script: flutter pub get
      - name: 初始化签名钥匙串
        script: |
          keychain initialize
      - name: 生成证书私钥并拉取签名证书
        script: |
          ssh-keygen -t rsa -b 2048 -m PEM -f /tmp/cert_private_key -N "" -q
          export CERTIFICATE_PRIVATE_KEY="$(cat /tmp/cert_private_key)"
          app-store-connect fetch-signing-files com.symbio.lbLifeformIos \
            --type IOS_APP_STORE --create \
            --certificate-key /tmp/cert_private_key
          echo "签名证书拉取完成"
      - name: 添加证书到钥匙串
        script: |
          keychain add-certificates
      - name: 配置Xcode签名
        script: |
          xcode-project use-profiles
      - name: 构建iOS签名版
        script: |
          flutter build ipa --release --export-method app-store
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - erlang@proton.me
